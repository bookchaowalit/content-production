# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
#
# Monorepo: the platform package at the root, Python packages under packages/, Python
# services under services/, Node apps under apps/. One job per app.
#   - Ruff lint runs once, in `platform`, over the whole repository (`ruff check .` honours
#     each service's own [tool.ruff] config); the other Python jobs set lint-command "".
#   - `ruff format --check` is off everywhere: formatting would rewrite ~530 files and move
#     every existing Semgrep finding. Left for a dedicated change.
#   - Sibling packages that a service imports (production-trace, brief-adapter-kit,
#     file-intake, document-production-ir) are installed next to it, as their READMEs do via
#     PYTHONPATH.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    # Same gate as the previous CI's `check` job and `python scripts/check.py`: the full
    # pytest suite, Ruff on the owned modules and strict mypy on the typed modules. Blender,
    # FreeCAD and Unity are not installed, so their real-runtime tests skip with an explicit
    # reason. FFmpeg and the runner's preinstalled Google Chrome are used so the audio,
    # game-asset and graphics rendering tests run for real. Dependencies come from the
    # committed root uv.lock (`uv sync --frozen`).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # requires-python >= 3.12
      timeout-minutes: 30
      install-command: >-
        sudo apt-get update
        && sudo apt-get install -y --no-install-recommends ffmpeg
        && uv sync --frozen --extra test
      format-check: false
      # scripts/check.py runs strict mypy on its MYPY_TARGETS; the auto `mypy .` would also
      # check every service and the Blender-worker modules, which are not typed to that bar.
      typecheck-command: ""
      test-command: book-production doctor && python scripts/check.py

  document-production:
    # Kept from the previous CI: the Documents service and its IR package, with a real Thai
    # TTF so the PDF renderer and the published-schema contract tests run for real. The font
    # must cover Latin and digits too (PDF text QA reads totals and dates back): TLWG Garuda
    # does, while NotoSansThai is Thai-only and fails that QA.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      install-command: >-
        sudo apt-get update
        && sudo apt-get install -y --no-install-recommends fonts-tlwg-garuda-ttf
        && test -f /usr/share/fonts/truetype/tlwg/Garuda.ttf
        && uv pip install
        -e "packages/document-production-ir[dev]"
        -e "services/document-production-api[dev]"
        -e packages/production-trace -e packages/brief-adapter-kit -e packages/file-intake
      lint-command: ""
      typecheck-command: ""
      test-command: >-
        export DOCUMENT_PRODUCTION_FONT=/usr/share/fonts/truetype/tlwg/Garuda.ttf
        && (cd packages/document-production-ir && python -m pytest)
        && (cd services/document-production-api && python -m pytest)

  brief-adapter-kit:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/brief-adapter-kit
      python-version: "3.12"
      lint-command: ""

  data-production-ir:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/data-production-ir
      python-version: "3.12"
      lint-command: ""

  file-intake:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/file-intake
      python-version: "3.12"
      lint-command: ""

  marketing-production-ir:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/marketing-production-ir
      python-version: "3.12"
      lint-command: ""

  production-trace:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/production-trace
      python-version: "3.12"
      install-command: uv pip install -e ".[dev]" -e ../brief-adapter-kit
      lint-command: ""

  web-production-ir:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/web-production-ir
      python-version: "3.12"
      lint-command: ""

  workflow-production-ir:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: packages/workflow-production-ir
      python-version: "3.12"
      lint-command: ""

  data-production-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/data-production-api
      python-version: "3.12"
      install-command: >-
        uv pip install -e ".[dev]"
        -e ../../packages/production-trace -e ../../packages/brief-adapter-kit -e ../../packages/file-intake
      lint-command: ""

  marketing-production-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/marketing-production-api
      python-version: "3.12"
      install-command: >-
        uv pip install -e ".[dev]"
        -e ../../packages/production-trace -e ../../packages/brief-adapter-kit -e ../../packages/file-intake
      lint-command: ""

  production-hub:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/production-hub
      python-version: "3.12"
      lint-command: "" # typecheck: auto (strict mypy from its [tool.mypy])

  production-pipelines:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/production-pipelines
      python-version: "3.12"
      install-command: >-
        uv pip install -e ".[dev]"
        -e ../../packages/production-trace -e ../../packages/brief-adapter-kit -e ../../packages/file-intake
      lint-command: ""
      # The package's documented strict mypy target (README); `mypy .` would include tests.
      typecheck-command: MYPYPATH=../../packages/document-production-ir mypy production_pipelines
      # Exception: tests/test_runner_fake_stages.py resolves stage roots from the old
      # monorepo layout (.../book-production-platform/src) and fails outside that checkout.
      # Every other test runs.
      test-command: python -m pytest -q --ignore=tests/test_runner_fake_stages.py

  video-postproduction:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/video-postproduction
      python-version: "3.12"
      # tests/test_compose.py reads the compose file with PyYAML, which the dev extra lacks.
      install-command: uv pip install -e ".[dev]" pyyaml -e ../../packages/production-trace
      lint-command: ""
      # Typecheck debt: strict `mypy .` reports 66 errors (5 in the package itself).
      typecheck-command: ""

  video-postproduction-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
    with:
      working-directory: services/video-postproduction-api
      python-version: "3.12" # matches its Dockerfile (python:3.12-slim)
      install-command: uv pip install -e ".[dev]" -e ../../packages/production-trace
      lint-command: ""
      # SPEC-001 R-CI-4: total coverage gate (baseline 80 %, rounded down) plus a per-module 90 % gate for the
      # modules SPEC-001 added. pytest fails by itself when no test is collected.
      test-command: >-
        python -m pytest -q --cov=video_postproduction --cov-report=json
        && python scripts/check_module_coverage.py coverage.json video_postproduction/api/limits.py video_postproduction/api/upload_stream.py video_postproduction/jobs/recovery.py video_postproduction/jobs/recovery_loop.py video_postproduction/migrate.py video_postproduction/retention.py
      coverage-threshold: "79"
      # Typecheck debt: `mypy .` reports 220 errors (20 in the package itself; the README
      # records a known baseline).
      typecheck-command: ""

  web-production-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/web-production-api
      python-version: "3.12"
      install-command: uv pip install -e ".[dev]" -e ../../packages/production-trace -e ../../packages/brief-adapter-kit
      lint-command: ""

  workflow-production-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: services/workflow-production-api
      python-version: "3.12"
      install-command: uv pip install -e ".[dev]" -e ../../packages/production-trace -e ../../packages/brief-adapter-kit
      lint-command: ""

  production-console-web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: apps/production-console-web
      build-command: npm run build

  video-postproduction-web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
    with:
      working-directory: apps/video-postproduction-web
      # SPEC-001 R-CI-4: vitest.config.ts writes coverage/coverage-summary.json and holds the per-file 90 % gates.
      test-command: npx vitest run --coverage
      require-tests: true
      coverage-threshold: "90"
      build-command: npm run build

  video-postproduction-desktop:
    # Typecheck and `node --test` only; packaging (`electron-forge make`) targets Windows Squirrel.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: apps/video-postproduction-desktop

  video-studio-postgres:
    # SPEC-001 R-CI-3: migration 0004 (BIGINT, repairs, round trip) on a real Postgres.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: video_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d video_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/video-postproduction-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]" -e ../../packages/production-trace
      - run: .venv/bin/python -m pytest -q tests/test_migration_0004.py tests/test_migrate_wrapper.py
        env:
          VIDEO_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/video_ci

  video-studio-config:
    # SPEC-001 AC-26: each secret reaches only its services in the merged production Compose config.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose version
      - run: python3 scripts/studio/check_config.py

  video-studio-bundle-smoke:
    # SPEC-001 AC-24: build and start the stack from the staged desktop runtime bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/video-postproduction-desktop
      - run: scripts/studio/bundle_smoke.sh

  video-studio-api-image:
    # SPEC-001 R-CI-1: blocking scan of the API/worker image.
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
    with:
      context: .
      dockerfile: services/video-postproduction-api/Dockerfile

  video-studio-web-image:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
    with:
      context: .
      dockerfile: services/video-postproduction/Dockerfile.web

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
