# Builds the real Windows installer of the video desktop app (Electron Forge + Squirrel)
# whenever the app or its packaging changes. The main CI job only typechecks and runs
# `node --test`; this job proves `npm run make` (smoke launcher, runtime staging, Squirrel)
# still works, e.g. after a Forge upgrade. Public repository: GitHub-hosted runner.
name: Desktop package (Windows)

on:
  pull_request:
    paths:
      - "apps/video-postproduction-desktop/**"
      - ".github/workflows/desktop-package.yml"
  push:
    branches: [main]
    paths:
      - "apps/video-postproduction-desktop/**"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: apps/video-postproduction-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/video-postproduction-desktop/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Make the Windows installer
        run: npm run make -- --platform=win32 --arch=x64

      - name: Verify the artifacts
        run: npm run verify:artifacts
