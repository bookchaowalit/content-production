[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-art-cli"
version = "0.1.0"
description = "art: cheap image work - brand templates with Thai text, batch sizes, contrast checks, local GPU drafts, ai-gateway finals, Blender 3D turntables"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11",
  "pythainlp>=5",
  "pyyaml>=6",
]

[project.optional-dependencies]
# local image generation on an NVIDIA GPU (install torch from the CUDA index, see install.sh)
gpu = ["torch", "diffusers", "transformers", "accelerate", "safetensors"]
extras = ["opencv-python-headless", "scikit-image", "trimesh", "moviepy", "cairosvg", "rembg", "onnxruntime-gpu"]
dev = ["pytest>=8.3,<10"]

[project.scripts]
art = "art_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["art_cli*"]

[tool.setuptools.package-data]
art_cli = ["brands/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
