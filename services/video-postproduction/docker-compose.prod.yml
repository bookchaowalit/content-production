# Hosted Video Studio on the homelab, reachable only over Tailscale (SPEC-001 F1, F4).
#
#   STUDIO_TAG=studio-v0.1.0 STUDIO_ENV_DIR=/srv/video-studio/env \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Needs Docker Compose >= 2.24.4 for !reset / !override. Secrets come only from the per-service env files written
# by scripts/studio/render-env.sh; every `environment` below is a full non-secret mapping (!override), so a base
# default such as VIDEO_EDITOR_API_TOKEN: ${...:-} can never shadow an env-file value (R-COMPOSE-2).
name: video-studio

x-limits: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    ports: !reset []
    env_file: ["${STUDIO_ENV_DIR:?set STUDIO_ENV_DIR}/postgres.env"]
    environment: !override
      POSTGRES_USER: video
      POSTGRES_DB: video_postproduction
    mem_limit: 512m
    cpus: 1.0

  redis:
    <<: *restart
    ports: !reset []
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    cpus: 0.5

  api:
    <<: *restart
    image: video-studio-api:${STUDIO_TAG:?set STUDIO_TAG}
    ports: !reset []
    env_file: ["${STUDIO_ENV_DIR:?set STUDIO_ENV_DIR}/api.env"]
    environment: !override
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_BYTES: "2147483648"
      ALLOWED_VIDEO_MIME_TYPES: video/mp4,video/quicktime,video/webm,video/x-matroska
      CORS_ALLOWED_ORIGINS: ""
      TRANSCRIPTION_PROVIDER: faster_whisper
      TRANSCRIPTION_QUALITIES: fast
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      VIDEO_EDITOR_ALLOW_UNAUTHENTICATED: "false"
      WRITE_RATE_LIMIT_PER_MINUTE: "60"
      DAILY_TRANSCRIPTION_JOBS: "200"
      JOB_LEASE_SECONDS: "900"
      MAX_STAGE_ATTEMPTS: "3"
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *restart
    image: video-studio-api:${STUDIO_TAG:?set STUDIO_TAG}
    env_file: ["${STUDIO_ENV_DIR:?set STUDIO_ENV_DIR}/worker.env"]
    environment: !override
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      TRANSCRIPTION_PROVIDER: faster_whisper
      TRANSCRIPTION_QUALITIES: fast
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      JOB_LEASE_SECONDS: "900"
      MAX_STAGE_ATTEMPTS: "3"
    mem_limit: 2304m
    cpus: 4.0

  web:
    <<: *restart
    image: video-studio-web:${STUDIO_TAG:?set STUDIO_TAG}
    # Only Tailscale Serve can reach the web server (R-TS-1b): it shares the tailscale container's network
    # namespace and listens on loopback; it still reaches api:8000 through that namespace's Compose network.
    network_mode: service:tailscale
    ports: !reset []
    env_file: ["${STUDIO_ENV_DIR:?set STUDIO_ENV_DIR}/web.env"]
    environment: !override
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      STUDIO_ACCESS_MODE: tailscale
      VIDEO_POSTPRODUCTION_API_INTERNAL_URL: http://api:8000
    depends_on:
      tailscale:
        condition: service_healthy
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  tailscale:
    <<: *restart
    image: tailscale/tailscale@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4 # 1.104.7
    hostname: video-studio
    env_file: ["${STUDIO_ENV_DIR:?set STUDIO_ENV_DIR}/tailscale.env"]
    environment:
      TS_HOSTNAME: video-studio
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      # The one-use auth key logs in once; later starts reuse the state volume (R-TS-1).
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:video-studio
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 6
    mem_limit: 128m
    cpus: 0.5

volumes:
  tailscale_state:
